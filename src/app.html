<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Last Day finds every account a leaver still has, revokes on approval, and proves it from each system's own API." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply a stored theme before first paint (no flash). 'system' leaves it to prefers-color-scheme.
			try {
				var t = localStorage.getItem('lastday.theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
