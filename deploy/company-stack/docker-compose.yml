# Last Day demo company stack (VM 2): Keycloak (SSO) + Mattermost Team Edition (chat) + Postgres, behind Caddy (HTTPS).
# Everything here is the "fictional company's" infrastructure. Last Day (VM 1) connects to it through the real admin APIs.
# Usage: see README.md. Copy .env.example to .env first.
name: northwind-stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      MM_DB_PASSWORD: ${MM_DB_PASSWORD:?set MM_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # `start` (production mode) behind Caddy: TLS ends at the proxy, Keycloak speaks plain HTTP inside the network.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${KEYCLOAK_HOST:?set KEYCLOAK_HOST in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Substituted into the imported realm file (client secret of the `last-day` client).
      LASTDAY_CLIENT_SECRET: ${LASTDAY_CLIENT_SECRET:?set LASTDAY_CLIENT_SECRET in .env}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  mattermost:
    # If your registry does not have the version in .env, use 11.11.3 (see API_REFERENCE.md section 2).
    image: mattermost/mattermost-team-edition:${MATTERMOST_VERSION:-11.11.3}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MM_DB_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: https://${MATTERMOST_HOST:?set MATTERMOST_HOST in .env}
      # Personal access tokens: this is how Last Day authenticates (API_REFERENCE.md section 2.1).
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"      # lets `mmctl --local` bootstrap the first admin inside the container
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEOPENSERVER: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_PRIVACYSETTINGS_SHOWEMAILADDRESS: "true"
    volumes:
      - mm_config:/mattermost/config
      - mm_data:/mattermost/data
      - mm_plugins:/mattermost/plugins
      - mm_client_plugins:/mattermost/client/plugins

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [keycloak, mattermost]
    ports:
      - "80:80"
      - "443:443"
    environment:
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      MATTERMOST_HOST: ${MATTERMOST_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  mm_config:
  mm_data:
  mm_plugins:
  mm_client_plugins:
  caddy_data:
  caddy_config:
